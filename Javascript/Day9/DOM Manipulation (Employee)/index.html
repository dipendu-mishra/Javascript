<!DOCTYPE html>
<html lang="en">

<head>
      <meta charset="UTF-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>DOM manpulaiton</title>
      <!-- BS cdn -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet"
            integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">

      <!-- ext stylesheet -->
      <link rel="stylesheet" href="./style.css">
</head>

<body>
      <!-- main div -->
      <main>
            <!-- form container -->
            <div class="formContainer">
                  <!-- form to take user data -->
                  <form action="" onsubmit="event.preventDefault();formSubmit();" autocomplete="off" class="d-flex">
                        <div>
                              <label for="roll">Empid</label>
                              <input type="number" name="roll" id="roll" required>
                        </div>
                        <div>
                              <label for="name">Name</label>
                              <input type="text" name="name" id="name" required>
                        </div>
                        <div>
                              <label for="dept">Dept</label>
                              <select name="dept" id="dept" required class="py-1">
                                    <option value="Finance">Finance</option>
                                    <option value="HR">HR</option>
                                    <option value="IT">IT</option>
                                    <option value="Marketing">Marketing</option>
                                    <option value="Other">Other</option>
                              </select>
                        </div>
                        <div>
                              <label for="salary">Salary</label>
                              <input type="number" name="salary" id="salary" required>
                        </div>
                        <button type="submit">Add</button>
                  </form>  <!-- form ends here -->
            </div>

            <!-- table container -->
            <div class="tableContainer">
                  <!-- table to display user data -->
                  <table id="myTable">
                        <tr>
                              <th>Empid</th>
                              <th>Name</th>
                              <th>Dept</th>
                              <th>Salary</th>
                              <th>Action</th>
                        </tr>
                       
                  </table>   <!-- table ends here-->

                  <!-- to edit data -->
                  <div class="editorBox">
                        <form action="" onsubmit="event.preventDefault();formSubmit(); " autocomplete="off">
                             <b><div id="namediv"></div></b>
                              <div>
                                    <label for="dept1">Dept</label>
                                    <select name="dept1" id="dept1">
                                          <option value="Finance">Finance</option>
                                          <option value="HR">HR</option>
                                          <option value="IT">IT</option>
                                          <option value="Marketing">Marketing</option>
                                          <option value="Other">Other</option>
                                    </select>
                              </div>
                              <div>
                                    <label for="inc">Incremented Amount</label>
                                    <input type="number" name="inc" id="inc">
                              </div>
                              <div>
                                    <label for="salary1">New Salary</label>
                                    <input type="number" name="salary1" id="salary1">
                              </div>
                              <div>
                                    <button type="submit" class="btn btn-success" onclick="return addSalary()">Submit</button>
                                    <button class="btn btn-danger mx-3" onclick="return cancelAdd()">Cancel</button>
                              </div>
                        </form>
                  </div>
            </div>
      </main>
</body>
<script src="./script.js"></script>
</html>
