<!-- Check the given no Prime or not  -->

<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Prime number</title>
</head>
<body>
      <h3>Check the given number is Prime or not</h3>
      
      <!-- js code -->
      <script>
            // take input from user
            let number = +parseInt(prompt("Enter number","number"));
            let prime = true;

            // check number is 1 or not
            if(number == 1){
                  document.write("1 is not prime nor composite number");
            }
            //if number>1
            else if(number>1){
                  for(let i=2; i<number;i++){
                        if(number%i == 0){
                              prime = false;
                              break;
                        }
                  }
                  if(prime){
                        document.write(number+" is prime number")
                  }
                  else
                  document.write(number+ " is not prime number");                  
            }                              
      </script>
</body>
</html>
