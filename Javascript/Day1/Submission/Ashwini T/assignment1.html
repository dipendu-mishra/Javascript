<!--  Find the Largest  among given integers -->

<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Largest number</title>
</head>
<body>
      <h3>Find largest number</h3>
      <div id="para"></div>

      <!-- js code -->
      <script>
            // take input from user
            let num1 = +prompt("Enter number1", "num1");
            let num2 = +prompt("Enter number2", "num2");
            let num3 = +prompt("Enter number3", "num3"); 

            // check largest number
            let result = (num1>num2) ? (num1>num3 ? num1+" is greater than "+num2+" and "+num3: num3+" is greater than "+num1+" and "+num2) : (num2>num3 ? num2+" is greater than "+num1+" and "+num3 : num3+" is greater than "+num1+" and "+num2);
            
            // display result
            document.getElementById("para").innerHTML = result;
      </script>
</body>
</html>
