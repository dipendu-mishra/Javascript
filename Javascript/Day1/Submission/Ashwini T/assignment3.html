<!-- Check the given number is Armstrong number or not -->

<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Armstrong number</title>
</head>
<body>
      <h3>Check the given number is Armstrong number or not</h3>

      <!-- js code -->
      <script>
            // take input from user
            let n = +prompt("Enter number to be checked","number");
            let temp = n;
            document.write("Given number = "+n);
            // initialize sum
            let sum = 0;

            while(n>0){
                  let rem = n%10;
                  sum += rem*rem*rem;
                  n = parseInt(n/10);
            }
            document.write("<br>Sum of cube of each digit = "+sum);
            if(sum == temp){
                  document.write("<br><h4>Given number is armstrong number</h4>");  //153, 370,371
            }
            else
                  document.write("<br><h4>Given number is not armstrong number</h4>");

      </script>
</body>
</html>
