<!DOCTYPE html>
<html>
<head>
	<title>Multiplication table</title>
	<script type="text/javascript">

		const number =Number(prompt('Enter an integer: '));

		for(let i = 1; i <= 10; i++) {
			const result = i * number;
			console.log(number + "*" + i + "=" + result);
			document.write(number + "*" + i + "=" + result + "<br>");

		}
	</script>
</head>
<body>

</body>
</html>
