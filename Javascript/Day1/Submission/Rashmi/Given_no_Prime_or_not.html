<!DOCTYPE html>
<html>
<head>
	<title> Check the given number Prime or not </title>
	<script type="text/javascript">
		var a=prompt("Enter the number: ");
		var i=2;
		var b;
		var c = true;
		while(i<a)
		{
			b=a%i;
			if (b==0)
			{
				c = false;
				break;
			}
			i++;
		}

		if (c)
		{
			console.log( a + "Your number is a prime number");
		}
		else
		{
			console.log( a + "Your number is not a prime number");
		}
	</script>
</head>
<body>


</body>

</html>
