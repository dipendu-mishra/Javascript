<html>
	<head>
		<script>
			function largestnum()
			{
				var num1, num2, num3;
				num1 = Number(document.getElementById("no1").value);
				num2 = Number(document.getElementById("no2").value);
				num3 = Number(document.getElementById("no3").value);

				if(num1>num2 && num1>num3)
				{
					window.alert(num1+" is greatest");
				}
				else if(num2>num1 && num2>num3)
				{
					window.alert(num2+" is greatest");
                }
				else if(num3>num1 && num3>num1)
				{
					window.alert(num3+" is greatest");
				}
			}
		</script>
    </head>
        <body>
            <h1>Check largest number </h1>
            <br>
            Enter number 1: <input type="text" id="no1"></input><br>
            Enter number 2: <input type="text" id="no2"></input><br>
            Enter number 3: <input type="text" id="no3"></input><br>
            <button onclick="largestnum()">submit</button>
        </body>
 </html>
