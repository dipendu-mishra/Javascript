<!DOCTYPE html>
<html>
<head>
  <script src="jquery.min.js"></script>
    <meta charset="utf-8">
<style type="text/css">.table_style {
	width: 500px;
	margin: 0px auto;
	}
	table{
	width: 100%;
	border-collapse: collapse;
	}
	table tr td{
	width: 50%;
	border: 1px solid #ff751a;
	padding: 5px;
	}
	table tr th{
	border: 1px solid #79ff4d;
	padding: 5px;
	}
	.oddcolor{
	background-color:aqua;
	}
  .evencolor{
	background-color:rgb(182, 199, 199);
	}
  .heading{
    background-color:rgb(215, 226, 151);
  }
  .end{
    background-color:rgb(142, 164, 196);
    text-align: center;
  }
	</style>
  <title>Create a Zebra Stripes table effect</title>
</head>
<body>
<div class="table_style">
<table>
	<tr>
		<th>Student Name</th>
		<th>Marks in Science</th>
	</tr>
	<tr>
		<td>Janet</td>
		<td>85.00</td>
	</tr>
	<tr>
		<td>David</td>
		<td>92.00</td>
	</tr>
	<tr>
		<td>Arthur</td>
		<td>79.00</td>
	</tr>
	<tr>
		<td>Bill</td>
		<td>82.00</td>
	</tr>
	<tr>
		<td>Tom</td>
		<td>82.00</td>
	</tr>
	<tr>
		<td>Harry</td>
		<td>82.00</td>
	</tr>
  <tr><td colspan=2>Thank You</td></tr>
</table>
</div>
</body>
</html>
