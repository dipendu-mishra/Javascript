<script type="text/javascript">

// Understand the difference between for-in & for-of loop   

const student = {
    name: 'Monica',
    class: 7,
    age: 12
}
for ( let key in student ) 
{       
    console.log(key)
    console.log(student[key])
    //console.log(`${key} => ${student[key]}`);
}
