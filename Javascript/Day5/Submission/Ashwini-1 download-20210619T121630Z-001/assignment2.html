<!-- calclator -->

<!DOCTYPE html>
<html lang="en">
<head>
      <meta charset="UTF-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Calculator</title>
      <!-- bs cdn -->
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" crossorigin="anonymous">
      <!-- ext css -->
      <link rel="stylesheet" href="./style.css">
</head>
<body>
      <h2>Calculator</h2>
      <!-- calci container -->
      <div class="container1">
            <!-- area to display result -->
            <input type="text" name="screen" id="screen">
            <table>
                  <tr class="row">
                        <!-- buttons -->
                        <td class="col"><button>(</button></td>
                        <td class="col"><button>)</sup></button></td>
                        <td class="col"><button>C</button></td>
                        <td class="col"><button>/</button></td>
                  </tr>
                  <tr class="row">
                        <td class="col"><button>7</button></td>
                        <td class="col"><button>8</button></td>
                        <td class="col"><button>9</button></td>
                        <td class="col"><button>X</button></td>
                  </tr>
                  <tr class="row">
                        <td class="col"><button>4</button></td>
                        <td class="col"><button>5</button></td>
                        <td class="col"><button>6</button></td>
                        <td class="col"><button class="minus">-</button></td>
                  </tr>
                  <tr class="row">
                        <td class="col"><button>1</button></td>
                        <td class="col"><button>2</button></td>
                        <td class="col"><button>3</button></td>
                        <td class="col"><button>+</button></td>
                  </tr>
                  <tr class="row">
                        <td class="col"><button>%</button></td>
                        <td class="col"><button>0</button></td>
                        <td class="col"><button>.</button></td>
                        <td class="col"><button>=</button></td>
                  </tr>
            </table>
      </div>

      <!-- ext js -->
      <script src="./index.js"></script>
</body>
</html>
