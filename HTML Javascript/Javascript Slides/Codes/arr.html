<html>
<script type="text/javascript">
var cust=new String("Hello World")
var cust1=new String("Hi World")
document.writeln(cust+"<br>")
document.writeln(cust.charAt(1)+"<br>")
document.writeln(cust.fontcolor("red")+"<br>")
document.writeln(cust.fontsize(28)+"<br>")
document.writeln(cust.concat(" ",cust1)+"<br>")
document.writeln(cust.indexOf("l")+"<br>")
document.writeln(cust.replace("l","o")+"<br>")
document.writeln(cust.substr(1,3)+"<br>")
//document.writeln(cust.substr(-1,3)+"<br>")
</script>
</html>
