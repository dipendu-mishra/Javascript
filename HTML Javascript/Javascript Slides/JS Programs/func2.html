<html>
<head>
<script type="text/javascript">
function intobj()
{
	this.i;
	return this;
}

function start()
{
	var i;
	var obj=new intobj();
	i=0;
	obj.i=0;
	document.write("<br>Before<br>");
	document.write("i= "+i);
	document.write("<br>");
	document.write("intobj = "+obj.i);
	document.write("<br>");
	modify(i,obj);
	document.write("<br>After<br>");
	document.write("i = "+i);
	document.write("<br>");
	document.write("intobj = "+obj.i);
	document.write("<br>");
}
function modify(n,obj)
{
	n++;
	obj.i++;	
}
</script>
</head>
<body>
<script type="text/javascript">
start();
</script>
</body>
</html>
