<html>
<script type="text/javascript">
function f1(name)
{
	if(name != null)
	{
		document.writeln(name);
	}
}
function f1()
{
	document.write("second f1()");
}
</script>
<body>
<script>
document.writeln("\nFirst call to f1()\n");

</script>
</body>

</html>
